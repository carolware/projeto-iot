# Broker da instância central (cloud).
# Etapa A0: sem TLS e com acesso anônimo, só para substituir o HiveMQ público.
# Etapa A4 endurece: TLS 1.2+ (8883/WSS), credencial por dispositivo e ACL.

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous true
