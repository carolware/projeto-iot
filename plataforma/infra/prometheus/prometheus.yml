# Coleta das métricas da plataforma (RF-OBS-01). Alvos = nomes dos serviços no compose.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - alertas.yml

scrape_configs:
  - job_name: central
    metrics_path: /metrics/
    static_configs:
      - targets: ["central:8000"]

  - job_name: central-ingestao   # uma entrada por réplica (DNS do compose devolve todas)
    dns_sd_configs:
      - names: ["central-ingestao"]
        type: A
        port: 9100

  - job_name: borda
    static_configs:
      - targets: ["borda-tocantins:9100"]
        labels: { borda: borda-tocantins }
      - targets: ["borda-goias:9100"]
        labels: { borda: borda-goias }
