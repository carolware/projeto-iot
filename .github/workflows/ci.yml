name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plataforma
    services:
      timescaledb:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: sentinela
          POSTGRES_PASSWORD: sentinela
          POSTGRES_DB: sentinela
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinela"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://sentinela:sentinela@localhost:5432/sentinela_teste
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: plataforma/requirements*.txt
      - name: Instalar dependências
        run: pip install -r requirements-dev.txt -e .
      - name: Lint (ruff)
        run: |
          ruff check nucleo central tests
          ruff format --check nucleo central tests
      - name: Testes (unidade + integração com TimescaleDB) e cobertura (RNF-15 ≥ 70%)
        run: pytest --cov --cov-report=term-missing --cov-fail-under=70

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar docker-compose
        run: cp .env.example .env && docker compose config --quiet
      - name: Build da imagem Python
        run: docker build -t sentinela-plataforma plataforma
