# Topologia edge → fog → cloud (ver plano, seção "Arquitetura Edge → Fog → Cloud")
#
#   rede campo-tocantins:  estações + atuadores ── mosquitto-borda-tocantins ── borda-tocantins ─┐
#   rede campo-goias:      estações + atuadores ── mosquitto-borda-goias ───── borda-goias ─────┤ rede nuvem
#   zonas sem borda (PA/MA) e terminais das prefeituras falam direto com a central ───────────────┘
#
# Segurança (etapa A4): todo MQTT é TLS 1.2+ com a CA própria (gerada pelo serviço
# `pki`), sem acesso anônimo, com credencial e ACL por dispositivo; usuários entram
# pelo Keycloak (OIDC). Segredos de desenvolvimento ficam no .env (ver .env.example).
#
# Para simular a queda do link de uma fazenda:  sh plataforma/simuladores/demo/link.sh off tocantins

x-plataforma: &plataforma
  image: sentinela/plataforma:dev   # uma imagem para todos os serviços Python
  build:
    context: ./plataforma
  restart: unless-stopped

# ambiente comum: cliente MQTT sobre TLS (verifica o broker pela CA da plataforma)
# e logs JSON com id_mensagem para correlação (A6)
x-ambiente: &ambiente
  MQTT_PORT: "8883"
  MQTT_CA: /pki/ca.crt
  LOG_FORMATO: json
  # rastreamento (RF-OBS-03): central, ingestão e bordas exportam para o Jaeger; vazio = desligado
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT-http://jaeger:4318}
  OTEL_TRACES_SAMPLER: parentbased_traceidratio
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_AMOSTRAGEM:-1.0}

x-mosquitto: &mosquitto
  image: eclipse-mosquitto:2.0.20
  entrypoint: ["/bin/sh", "/iniciar.sh"]   # sobe o broker e recarrega quando senhas/ACL mudam
  restart: unless-stopped
  depends_on:
    pki:
      condition: service_completed_successfully

services:
  # ── Inicialização: CA própria e certificados dos brokers ───────────────────
  pki:
    <<: *plataforma
    restart: "no"
    command: ["python", "/app/gerar_pki.py", "--saida", "/pki",
              "mosquitto-central", "mosquitto-borda-tocantins", "mosquitto-borda-goias"]
    volumes:
      - ./plataforma/infra/pki/gerar.py:/app/gerar_pki.py:ro
      - ./plataforma/infra/pki/gerado:/pki

  # ── Cloud: instância central ───────────────────────────────────────────────
  mosquitto-central:
    <<: *mosquitto
    ports:
      - "8883:8883"   # MQTT/TLS (dispositivos diretos, bridges das bordas, scripts locais)
    volumes:
      - ./plataforma/infra/mosquitto/iniciar.sh:/iniciar.sh:ro
      - ./plataforma/infra/mosquitto/central/mosquitto.conf.modelo:/mosquitto/config/mosquitto.conf.modelo:ro
      - ./plataforma/infra/pki/gerado:/pki:ro
      - acesso-central:/mosquitto/acesso       # senhas/ACL escritas pela central
      - mosquitto-central-data:/mosquitto/data
    networks: [nuvem]

  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinela}
      POSTGRES_USER: ${POSTGRES_USER:-sentinela}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinela}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"   # host:container (5433 evita conflito com Postgres local)
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [nuvem]
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_SENHA:-admin}
      KC_HOSTNAME: http://localhost:8080        # emissor dos tokens (o navegador acessa por aqui)
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"    # a central busca as chaves por keycloak:8080
    ports:
      - "8080:8080"
    volumes:
      - ./plataforma/infra/keycloak/sentinela-realm.json:/opt/keycloak/data/import/sentinela-realm.json:ro
      - keycloak-dados:/opt/keycloak/data   # usuários e TOTP configurados persistem
    networks: [nuvem]
    restart: unless-stopped

  central:
    <<: *plataforma
    # migrations + seed (idempotentes) antes de subir a API
    command: >
      sh -c "alembic -c central/alembic.ini upgrade head
      && python -m central.seeds.seed
      && uvicorn central.app:app --host 0.0.0.0 --port 8000"
    environment:
      <<: *ambiente
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sentinela}:${POSTGRES_PASSWORD:-sentinela}@postgres:5432/${POSTGRES_DB:-sentinela}
      MQTT_BROKER: mosquitto-central
      MQTT_USUARIO: central
      MQTT_SENHA: ${MQTT_SENHA_CENTRAL:?defina no .env}
      # a ingestão MQTT roda no serviço central-ingestao; a API ouve o barramento plataforma/...
      CENTRAL_INGESTAO_SEPARADA: "1"
      MQTT_ACESSO_DIR: /acesso
      # senhas dos usuários de serviço do broker (a central grava só os hashes)
      MQTT_SENHA_CENTRAL: ${MQTT_SENHA_CENTRAL}
      MQTT_SENHA_SIMULACAO: ${MQTT_SENHA_SIMULACAO:?defina no .env}
      SEGREDO_PROVISIONAMENTO: ${SEGREDO_PROVISIONAMENTO:?defina no .env}
      CREDENCIAL_BORDA_TOCANTINS: ${CREDENCIAL_BORDA_TOCANTINS:?defina no .env}
      CREDENCIAL_BORDA_GOIAS: ${CREDENCIAL_BORDA_GOIAS:?defina no .env}
      OIDC_EMISSOR: http://localhost:8080/realms/sentinela
      OIDC_JWKS_URL: http://keycloak:8080/realms/sentinela/protocol/openid-connect/certs
    ports:
      - "8000:8000"   # API REST + Swagger em /docs
    volumes:
      - ./plataforma/infra/pki/gerado:/pki:ro
      - acesso-central:/acesso
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto-central:
        condition: service_started
    networks: [nuvem]

  # ingestão MQTT da central em processos próprios (RNF-01, RNF-09): assina os
  # tópicos dos dispositivos, grava no banco e publica as aceitas no barramento
  # plataforma/... Escala horizontal prevista: réplicas dividem as mensagens por
  # assinatura compartilhada ($share/ingestao/...). Cada réplica precisa de um
  # client id FIXO (sessão persistente): ao reduzir réplicas, apague a sessão da
  # que saiu, senão o broker continua enfileirando para ela a parte dela.
  central-ingestao:
    <<: *plataforma
    command: ["python", "-m", "central.ingestao_mqtt"]
    deploy:
      replicas: 1
    environment:
      <<: *ambiente
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sentinela}:${POSTGRES_PASSWORD:-sentinela}@postgres:5432/${POSTGRES_DB:-sentinela}
      MQTT_BROKER: mosquitto-central
      MQTT_USUARIO: central
      MQTT_SENHA: ${MQTT_SENHA_CENTRAL:?defina no .env}
      CENTRAL_MQTT_GRUPO: ingestao
      CENTRAL_MQTT_CLIENT_ID: central-ingestao   # sessão persistente estável entre recriações
    ports:
      - "9103:9100"   # métricas Prometheus
    volumes:
      - ./plataforma/infra/pki/gerado:/pki:ro
    depends_on: [central]
    networks: [nuvem]

  conector-firms:
    <<: *plataforma
    command: ["python", "simuladores/conector_firms/conector.py"]
    env_file: .env
    environment:
      <<: *ambiente
      MQTT_BROKER: mosquitto-central
    volumes:
      - ./plataforma/infra/pki/gerado:/pki:ro
    depends_on: [mosquitto-central]
    networks: [nuvem]

  # ── Fog: nós de borda (um por região rural) ────────────────────────────────
  mosquitto-borda-tocantins:
    <<: *mosquitto
    environment:
      BRIDGE_SENHA: ${CREDENCIAL_BORDA_TOCANTINS}
    ports:
      - "8884:8883"
    volumes:
      - ./plataforma/infra/mosquitto/iniciar.sh:/iniciar.sh:ro
      - ./plataforma/infra/mosquitto/borda-tocantins/mosquitto.conf.modelo:/mosquitto/config/mosquitto.conf.modelo:ro
      - ./plataforma/infra/pki/gerado:/pki:ro
      - acesso-borda-tocantins:/mosquitto/acesso   # senhas/ACL baixadas da central pela borda
      - mosquitto-borda-tocantins-data:/mosquitto/data
    networks: [campo-tocantins, nuvem]

  borda-tocantins:
    <<: *plataforma
    command: ["python", "-m", "borda.app"]
    environment:
      <<: *ambiente
      BORDA_ID: borda-tocantins
      BORDA_SITES: mateiros,lagoa-da-confusao,sandolandia
      BORDA_CREDENCIAL: ${CREDENCIAL_BORDA_TOCANTINS}
      BORDA_CHAVE: ${BORDA_CHAVE_TOCANTINS:?defina BORDA_CHAVE_TOCANTINS no .env}
      BORDA_FILA: /dados/fila.db
      BORDA_ACESSO_DIR: /acesso
      MQTT_BROKER: mosquitto-borda-tocantins
      CENTRAL_URL: http://central:8000
      BORDA_PAINEL_SENHA: ${BORDA_PAINEL_SENHA:-}   # vazio = painel local desligado
    ports:
      - "8081:8080"   # HTTP local: ingestão (RF-EDG-01) e painel do técnico (RF-EDG-07)
      - "9101:9100"   # métricas Prometheus
    volumes:
      - borda-tocantins-dados:/dados
      - acesso-borda-tocantins:/acesso
      - ./plataforma/infra/pki/gerado:/pki:ro
    depends_on: [mosquitto-borda-tocantins, central]
    networks: [campo-tocantins, nuvem]

  mosquitto-borda-goias:
    <<: *mosquitto
    environment:
      BRIDGE_SENHA: ${CREDENCIAL_BORDA_GOIAS}
    ports:
      - "8885:8883"
    volumes:
      - ./plataforma/infra/mosquitto/iniciar.sh:/iniciar.sh:ro
      - ./plataforma/infra/mosquitto/borda-goias/mosquitto.conf.modelo:/mosquitto/config/mosquitto.conf.modelo:ro
      - ./plataforma/infra/pki/gerado:/pki:ro
      - acesso-borda-goias:/mosquitto/acesso
      - mosquitto-borda-goias-data:/mosquitto/data
    networks: [campo-goias, nuvem]

  borda-goias:
    <<: *plataforma
    command: ["python", "-m", "borda.app"]
    environment:
      <<: *ambiente
      BORDA_ID: borda-goias
      BORDA_SITES: anapolis,formosa,pirenopolis,jaragua
      BORDA_CREDENCIAL: ${CREDENCIAL_BORDA_GOIAS}
      BORDA_CHAVE: ${BORDA_CHAVE_GOIAS:?defina BORDA_CHAVE_GOIAS no .env}
      BORDA_FILA: /dados/fila.db
      BORDA_ACESSO_DIR: /acesso
      MQTT_BROKER: mosquitto-borda-goias
      CENTRAL_URL: http://central:8000
      BORDA_PAINEL_SENHA: ${BORDA_PAINEL_SENHA:-}   # vazio = painel local desligado
    ports:
      - "8082:8080"   # HTTP local: ingestão (RF-EDG-01) e painel do técnico (RF-EDG-07)
      - "9102:9100"
    volumes:
      - borda-goias-dados:/dados
      - acesso-borda-goias:/acesso
      - ./plataforma/infra/pki/gerado:/pki:ro
    depends_on: [mosquitto-borda-goias, central]
    networks: [campo-goias, nuvem]

  # ── Edge: dispositivos simulados (credencial de cada um derivada de SEGREDO_PROVISIONAMENTO) ──
  estacoes-tocantins:
    <<: *plataforma
    command: ["python", "simuladores/estacao/sensor.py"]
    env_file: .env
    environment:
      <<: *ambiente
      ZONAS: mateiros,lagoa-da-confusao,sandolandia
      MQTT_BROKER: mosquitto-borda-tocantins
    volumes:
      - ./plataforma/infra/pki/gerado:/pki:ro
    depends_on: [mosquitto-borda-tocantins]
    networks: [campo-tocantins]

  atuadores-tocantins:
    <<: *plataforma
    command: ["python", "simuladores/atuador/atuador.py"]
    env_file: .env
    environment:
      <<: *ambiente
      ZONAS: mateiros,lagoa-da-confusao,sandolandia
      MQTT_BROKER: mosquitto-borda-tocantins
    volumes:
      - ./plataforma/infra/pki/gerado:/pki:ro
    depends_on: [mosquitto-borda-tocantins]
    networks: [campo-tocantins]

  estacoes-goias:
    <<: *plataforma
    command: ["python", "simuladores/estacao/sensor.py"]
    env_file: .env
    environment:
      <<: *ambiente
      ZONAS: anapolis,formosa,pirenopolis,jaragua
      MQTT_BROKER: mosquitto-borda-goias
    volumes:
      - ./plataforma/infra/pki/gerado:/pki:ro
    depends_on: [mosquitto-borda-goias]
    networks: [campo-goias]

  atuadores-goias:
    <<: *plataforma
    command: ["python", "simuladores/atuador/atuador.py"]
    env_file: .env
    environment:
      <<: *ambiente
      ZONAS: anapolis,formosa,pirenopolis,jaragua
      MQTT_BROKER: mosquitto-borda-goias
    volumes:
      - ./plataforma/infra/pki/gerado:/pki:ro
    depends_on: [mosquitto-borda-goias]
    networks: [campo-goias]

  # zonas com conexão direta (sem nó de borda)
  estacoes-diretas:
    <<: *plataforma
    command: ["python", "simuladores/estacao/sensor.py"]
    env_file: .env
    environment:
      <<: *ambiente
      ZONAS: novo-progresso,mirador
      MQTT_BROKER: mosquitto-central
    volumes:
      - ./plataforma/infra/pki/gerado:/pki:ro
    depends_on: [mosquitto-central]
    networks: [nuvem]

  atuadores-diretos:
    <<: *plataforma
    command: ["python", "simuladores/atuador/atuador.py"]
    env_file: .env
    environment:
      <<: *ambiente
      ZONAS: novo-progresso,mirador
      MQTT_BROKER: mosquitto-central
    volumes:
      - ./plataforma/infra/pki/gerado:/pki:ro
    depends_on: [mosquitto-central]
    networks: [nuvem]

  # terminais de alerta das prefeituras (Go) — cadastrados por
  # plataforma/simuladores/demo/cadastrar_alerta_publico.py
  terminais:
    build:
      context: ./plataforma
      dockerfile: simuladores/terminal_go/Dockerfile
    environment:
      <<: *ambiente
      MQTT_BROKER: mosquitto-central
      SEGREDO_PROVISIONAMENTO: ${SEGREDO_PROVISIONAMENTO}
      AUTO_RECONHECER_S: "20"
      TERMINAIS: >-
        pref-anapolis/defesa-civil/alerta_publico/terminal-dc-anapolis,pref-anapolis/bombeiros/alerta_publico/terminal-bm-anapolis,pref-formosa/defesa-civil/alerta_publico/terminal-dc-formosa,pref-formosa/bombeiros/alerta_publico/terminal-bm-formosa,pref-pirenopolis/defesa-civil/alerta_publico/terminal-dc-pirenopolis,pref-pirenopolis/bombeiros/alerta_publico/terminal-bm-pirenopolis,pref-jaragua/defesa-civil/alerta_publico/terminal-dc-jaragua,pref-jaragua/bombeiros/alerta_publico/terminal-bm-jaragua
    volumes:
      - ./plataforma/infra/pki/gerado:/pki:ro
    depends_on: [mosquitto-central]
    networks: [nuvem]
    restart: unless-stopped

  # ── Observabilidade (A6) ───────────────────────────────────────────────────
  # coleta /metrics da central e das bordas; alertas operacionais em infra/prometheus/alertas.yml.
  # Fica também nas redes de campo (acesso de gerência): com o link da fazenda cortado,
  # ainda dá para ver a fila da borda crescendo.
  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./plataforma/infra/prometheus:/etc/prometheus:ro
      - prometheus-dados:/prometheus
    depends_on: [central]
    networks: [nuvem, campo-tocantins, campo-goias]
    restart: unless-stopped

  # traces distribuídos (RF-OBS-03): UI em http://localhost:16686; recebe OTLP/HTTP na 4318.
  # Nas redes de campo pelo mesmo motivo do Prometheus: a borda continua exportando sem o link.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    networks: [nuvem, campo-tocantins, campo-goias]
    restart: unless-stopped

  # ── Aplicação ──────────────────────────────────────────────────────────────
  front:
    build:
      context: ./front
      dockerfile: Dockerfile
      args:
        # o navegador fala com a API e o Keycloak (OIDC); nada de MQTT no front
        VITE_API_URL: http://localhost:8000
        VITE_KEYCLOAK_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on: [central, keycloak]
    networks: [nuvem]
    restart: unless-stopped

networks:
  nuvem:
  campo-tocantins:
  campo-goias:

volumes:
  mosquitto-central-data:
  mosquitto-borda-tocantins-data:
  mosquitto-borda-goias-data:
  acesso-central:
  acesso-borda-tocantins:
  acesso-borda-goias:
  borda-tocantins-dados:
  borda-goias-dados:
  postgres-data:
  keycloak-dados:
  prometheus-dados:
